<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | 東海大学 演劇研究会</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
    }
    .error-container {
      padding: 20px;
    }
    .error-code {
      font-size: 5rem;
      color: #8b0000; /* エンジ */
      margin: 0;
      opacity: 0.8;
    }
    h1 { font-size: 1.5rem; margin: 20px 0; letter-spacing: 2px; }
    p { color: #888; margin-bottom: 40px; line-height: 2; }
    .btn-home {
      color: #fff;
      text-decoration: none;
      border: 1px solid #fff;
      padding: 12px 30px;
      transition: 0.3s;
      font-size: 0.9rem;
    }
    .btn-home:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <p class="error-code">404</p>
    <h1>CURTAIN CALL</h1>
    <p>
      お探しの物語（ページ）は、幕が閉じたか、<br>
      まだ書き始められていないようです。
    </p>
    <a href="index.html" class="btn-home">劇場入り口（ホーム）へ戻る</a>
  </div>
</body>
</html>
